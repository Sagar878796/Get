
name: PHP to M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PHP playlist
        run: |
          curl -fLsS \
            "https://premiumplugx.com/VIP/pluglist.php" \
            -o playlist.m3u

      - name: Validate M3U
        run: |
          head -n 1 playlist.m3u | grep -q '#EXTM3U'
          test -s playlist.m3u

      - name: Save playlist to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || \
            git commit -m "Update M3U playlist"
          git push
          
